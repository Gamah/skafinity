<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>skafinity embed — a dark, hand-rolled host page</title>
  <!-- The opposite host: hand-rolled dark, a serif display face, square corners, a hot accent under
       a plain --accent name, and no framework anywhere. Same element as embed-light.html, same
       absence of configuration — if the sniff is doing its job these two pages produce two widgets
       that each look like they were built for the page they are on. -->
  <style>
    :root {
      --accent: #ff5c2a;
      --ink: #e8e2d9;
      --paper: #14110e;
      --panel: #1d1915;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      font-size: 17px;
      line-height: 1.6;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 64px 20px 96px; }
    h1 { font-size: 40px; font-weight: 400; letter-spacing: -0.5px; margin: 0 0 8px; }
    h1 em { color: var(--accent); font-style: normal; }
    .sub { color: #8b8177; margin: 0 0 40px; }
    .block { background: var(--panel); border-left: 3px solid var(--accent); padding: 20px 24px; margin-bottom: 32px; }
    /* Square, flat, uppercase — nothing like the light page's buttons, which is the test. */
    button {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 0;
      padding: 8px 18px;
      font: inherit;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }
    a { color: var(--accent); }
    .readout { font-size: 13px; color: #8b8177; margin-top: 12px; }
    .readout b { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>A dark page that embeds <em>skafinity</em></h1>
    <p class="sub">Hand-rolled: serif, square corners, <code>--accent</code>, no framework.</p>

    <div class="block">
      <p>Filler paragraph, so the widget sits inside a page rather than on a blank canvas.
        <button type="button">A button</button></p>
    </div>

    <!-- No theme, no accent, no CSS: everything below is sniffed. -->
    <skafinity-player storage-key="demo-dark"></skafinity-player>
    <p class="readout" id="readout"></p>

    <p><a href="index.html">← back to skafinity</a> · <a href="embed-light.html">the same element on a light page →</a></p>
  </div>

  <script type="module">
    await import('./skafinity-element.js');
    const el = document.querySelector('skafinity-player');
    const show = () => {
      const t = el.themeInfo;
      document.getElementById('readout').innerHTML =
        `sniffed: mode <b>${t.mode}</b>, accent from <b>${t.accentSource}</b>`;
    };
    el.addEventListener('theme', show);
    show();
  </script>
</body>
</html>

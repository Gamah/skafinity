<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>skafinity — endless procedural music</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <div class="htop">
        <h1>ska<span>finity</span></h1>
        <a class="ghlink" href="https://github.com/Gamah/skafinity" target="_blank" rel="noopener">find it on GitHub!</a>
      </div>
      <p class="tag">endless, deterministic procedural songs — ska, rock, country, metal, punk and pop. The whole song is a URL.</p>
    </header>

    <section class="transport">
      <button id="prevBtn" title="Previous song">⏮</button>
      <button id="playBtn" class="big" title="Play / Pause">▶</button>
      <button id="nextBtn" title="Next song">⏭</button>
      <span class="now">now playing <b>#<span id="nNow">0</span></b></span>
      <span id="bufState" class="bufstate"></span>
      <label class="vol">vol <input id="vol" type="range" min="0" max="1.5" step="0.01" value="0.8" /></label>
    </section>

    <section class="seedbar">
      <input id="seed" type="text" spellcheck="false" placeholder="vibe:tag:n  /  tag:n  /  tag" />
      <button id="seedGo">go</button>
      <button id="copyBtn">copy link</button>
    </section>

    <div class="cols">
      <section class="panel">
        <h2>vibe
          <label class="genre">Genre: <select id="genre"></select></label>
          <!-- Listening toggle for who a section's metric displacement moves. Config-only, not
               in the seed (see MusicGen.Config.DisplaceMode) — a shared link must not depend on
               it, so it is a local preference like the per-voice volumes. -->
          <label class="genre" title="Who a section's metric displacement moves">Displace: <select id="displace"></select></label>
          <button id="rerollBtn" class="reroll" title="Randomize every knob but the volumes">🎲 reroll vibe</button>
          <button id="shuffleBtn" class="reroll toggle on" title="Re-roll genre + every knob for each new song (keeps your volumes)">🎲 every song: ON</button>
        </h2>
        <div id="vibe" class="vibe"></div>
      </section>

      <section class="panel">
        <h2>playlist <small>n rolls forever →</small></h2>
        <div id="playlist" class="playlist"></div>
        <div class="jump">
          jump to <input id="jumpN" type="number" min="0" value="0" /> <button id="jumpBtn">go</button>
          <span class="export">
            <button id="dlBtn">⬇ download .wav</button>
          </span>
        </div>
      </section>
    </div>

    <p id="status" class="status"></p>
    <footer>seed format <code>vibe:tag:n</code> · share the URL, get the same song · export is stereo .wav</footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

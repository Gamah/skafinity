server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # …except the ENTRYPOINT, which is the one file in there with a fixed name. dotnet.js ends in
    # withConfig({…resources…}) — the manifest of those hashed names — so a browser holding a
    # year-old copy boots a year-old asset list and never asks for the new bundle at all. It does
    # not 404 and it does not warn: the old engine simply keeps playing under a new build. An exact
    # location beats the prefix one below whatever their order.
    location = /_framework/dotnet.js {
        add_header Cache-Control "no-cache";
    }

    # The rest of the .NET runtime bundle is content-hashed — cache it hard. (.wasm is served with
    # the correct application/wasm type by this nginx's stock mime.types.)
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page + glue change in place (no hashing), so never let a stale copy stick.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}

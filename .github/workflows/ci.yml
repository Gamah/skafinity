# The checks that can run without a .NET SDK — which is all of them that matter for what
# ships, because web/_framework is committed and the Pages deploy packages it rather than
# building it. Runs on every PR, so the answer arrives before a merge rather than after a
# deploy, and on preview/* because those branches can deploy to the live site.
#
# NOT on every branch push, and NOT on a DRAFT pull request. Both exclusions are the same
# rule and the same reason: re-staging web/_framework is a ~2-minute AOT publish that belongs
# at the END of a piece of work, not on every commit of it — so work in progress is EXPECTED
# to carry a stale bundle, and failing it mails the repo owner about a state that is not a
# defect, which is how a gate stops being read.
#
# The draft half was the door left open when the branch-push half was closed: a PR opened
# early to share progress re-runs CI on every push into it, so a draft PR put the gate back
# on exactly the intermediate commits the branch-push rule had just excused. Marking a PR
# ready is the signal that the work claims to be finished, which is when the gate is a real
# question — and `ready_for_review` has to be listed explicitly, because the default trigger
# types are opened/synchronize/reopened and do not include it, so a PR marked ready would
# otherwise never be checked at all.
#
# The gate itself is unchanged and still blocks what it was written to block: nothing reaches
# master except through a non-draft PR, and nothing reaches the live site except master or a
# preview/* branch, and both are checked.
#
# The engine's own C# tests (`make test-engine`) are deliberately NOT here: they need the SDK,
# they take ~25 s of pure synthesis, and they assert on composition rather than on what the
# site serves. Run them locally after an engine change — the render digests are a listening
# aid, not a merge gate.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [preview/**]   # master is covered by the Pages workflow, which gates on the same check

permissions:
  contents: read

jobs:
  check:
    # A draft PR is work in progress; see the header.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The one failure that is otherwise silent: an engine change committed without
      # re-staging web/_framework. Nothing 404s and no test fails — the site would just serve
      # the old engine. This is the gate, and it is first because it is the cheapest.
      - name: Is the committed bundle built from the current engine?
        run: make check-bundle

      # Boots the published wasm under node: the raw [JSExport] boundary, then every call the
      # page actually makes against the `mod` object engine.js returns.
      - name: JS/wasm boundary
        run: make test

      # Builds both dist artifacts and boots the single file's inlined runtime, so a change to
      # the page or the bundler cannot break the handout without failing here.
      - name: Packaging
        run: make test-dist
